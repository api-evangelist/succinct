name: Succinct
description: >-
  Succinct is an applied cryptography company building zero-knowledge proof
  infrastructure. Its flagship product is SP1, an open-source zkVM that proves the
  correct execution of RISC-V programs, and the Succinct Prover Network (SPN), a
  decentralized on-chain marketplace on Ethereum that coordinates a distributed
  network of provers to generate ZK proofs for any piece of software, settled with
  the PROVE token. Succinct's programmatic surface is a gRPC/protobuf API (the
  ProverNetwork, ArtifactStore, and Verifier services) rather than REST/OpenAPI;
  developers integrate in Rust via the SP1 SDK and CLI (cargo prove / sp1up) and
  authenticate to the network with a Secp256k1 key pair. Backed by Paradigm.
